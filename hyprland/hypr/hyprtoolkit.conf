# ~/.config/hypr/hyprtoolkit.conf

# Nord Color Palette (Format is 0xAARRGGBB)
background = 0xFF2E3440        # Polar Night (Base background)
base = 0xFF3B4252              # Polar Night (Elevated elements like buttons)
alternate_base = 0xFF434C5E    # Polar Night (Hover/Active states)
text = 0xFFD8DEE9              # Snow Storm (Standard text)
bright_text = 0xFFECEFF4       # Snow Storm (Headings/Bright text)
accent = 0xFF81A1C1            # Frost (Primary accent, matches your UI borders)
accent_secondary = 0xFF88C0D0  # Frost (Secondary accent)

# Fonts & Icons (Matching your system defaults)
font_family = GoogleSansMNerdFont-Regular
font_size = 13
h1_size = 19
h2_size = 15
h3_size = 13
icon_theme = Papirus-Dark

# Corner Rounding
rounding_large = 10
rounding_small = 5             # Matches your Hyprland global rounding
