theme = "nord"
close_when_open = true
force_keyboard_focus = true

[builtins.applications]
weight = 100

[builtins.runner]
weight = 90

[providers]
default = ["desktopapplications", "runner", "files", "clipboard"]

[[providers.prefixes]]
prefix = "/"
provider = "files"

[[providers.prefixes]]
prefix = ":"
provider = "clipboard"
