# ~/.config/hypr/hyprlock.conf
general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

# BACKGROUND
background {
    monitor =
    # You can point this to a Nord wallpaper or use "screenshot" to blur your active desktop
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    
    # Fallback color (Nord0)
    color = rgb(46, 52, 64) 
}

# TIME
label {
    monitor =
    text = $TIME
    color = rgb(216, 222, 233) # Nord4
    font_size = 90
    font_family = GoogleSansMNerdFont-Regular

    position = 0, 150
    halign = center
    valign = center
}

# GREETING
label {
    monitor =
    text = Welcome, $DESC
    color = rgb(216, 222, 233) # Nord4
    font_size = 20
    font_family = GoogleSansMNerdFont-Regular

    position = 0, 40
    halign = center
    valign = center
}

# PASSWORD INPUT FIELD
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    
    outer_color = rgb(136, 192, 208)  # Nord8 (Light Blue border)
    inner_color = rgb(59, 66, 82)     # Nord1 (Dark box)
    font_color = rgb(216, 222, 233)   # Nord4 (Text)
    
    fade_on_empty = false
    placeholder_text = <i>󰌾 Enter Password...</i>
    hide_input = false
    
    # Validation colors
    check_color = rgb(235, 203, 139)  # Nord13 (Yellow checking)
    fail_color = rgb(191, 97, 106)    # Nord11 (Red fail)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    
    position = 0, -40
    halign = center
    valign = center
}
